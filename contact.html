<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace - Contact Us</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="header-bar">
            <a href="index.html" class="logo">FocusSpace</a>
            
            <label for="nav-toggle" class="nav-toggle">
                <figure>
                  <img src="img/list.svg" width="32" height="32" alt="Toggle navigation menu">
                </figure>
            </label>
        </div>

        <input type="checkbox" id="nav-toggle" class="nav-toggle-checkbox">
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">
        <section class="contact-section">
            <div class="contact-card">
                <h1>Reserve Your Workspace</h1>
                <p>Have questions or want to book a dedicated desk? Leave your information below and our team will get in touch immediately.</p>
                
                <form class="contact-form" action="#" method="post">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input id="full-name" name="full-name" type="text" placeholder="e.g. Sarah Jenkins" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" placeholder="sarah@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="space-type">Preferred Space Type</label>
                        <input id="space-type" name="space-type" type="text" placeholder="e.g. Private Pod, Team Room, Open Desk">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us about your timing or special requirements..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary form-btn">Submit Reservation</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Copyright &copy;  FocusSpace</p>
    </footer>
</body>
</html>
